[project]
name = "ableton-mcp"
version = "0.1.0"
description = "MCP server that lets Claude organize, compose, mix and master in Ableton Live 12"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.9",
    "numpy>=2.0",
    "scipy>=1.13",
    "soundfile>=0.12",
]

[project.scripts]
ableton-mcp = "ableton_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "pyloudnorm>=0.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ableton_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["remote_script"]

name: CLA

# Asks first-time contributors to sign CLA.md by commenting on their pull request (D31).
# Signatures are committed to the unprotected `cla-signatures` branch, which must exist.
# pull_request_target runs in the base repo's context; this job never checks out pull request code.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      # The upstream repo is archived; pinned to the v2.6.1 commit.
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/cmdiego/ableton_live_mcp/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          allowlist: cmdiego,dependabot[bot],github-actions[bot]
